name: E13 CI/CD backend
run-name: E13 pipeline (${{ github.ref_name }})

on:
  push:
    branches:
      - featureE13
      - dev
      - release
      - main
  pull_request:
    branches: [dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e13-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: E13 · Build, pruebas, quality gate y API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      PORT: "3000"
      MONGODB_URI: mongodb://127.0.0.1:27017/task_management_e13
      MONGODB_DB_NAME: task_management_e13
      JWT_SECRET: e13-ci-only-secret-do-not-use-in-production
    steps:
      - name: Resolver rama del otro repositorio
        id: paired
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$GITHUB_HEAD_REF" = "featureE13" ]; then
              paired_ref="featureE13"
            else
              paired_ref="$GITHUB_BASE_REF"
            fi
          else
            paired_ref="$GITHUB_REF_NAME"
          fi
          echo "ref=$paired_ref" >> "$GITHUB_OUTPUT"

      - name: Descargar repositorio actual
        uses: actions/checkout@v4
        with:
          path: backend-source
          fetch-depth: 0

      - name: Descargar repositorio complementario
        uses: actions/checkout@v4
        with:
          repository: altair222000/Task_Management_frontend
          ref: ${{ steps.paired.outputs.ref }}
          token: ${{ github.token }}
          path: frontend-source
          fetch-depth: 0

      - name: Configurar Node.js del backend
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.1"
          cache: npm
          cache-dependency-path: backend-source/backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci --prefix backend-source/backend --ignore-scripts --no-audit --no-fund

      - name: Validar sintaxis del backend
        run: |
          find backend-source/backend \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Configurar Node.js del frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-source/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend-source/frontend --ignore-scripts --no-audit --no-fund

      - name: Compilar frontend para producción
        run: npm run build --prefix frontend-source/frontend

      - name: Ejecutar pruebas unitarias del backend
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.1"
          cache: npm
          cache-dependency-path: backend-source/backend/package-lock.json

      - name: Correr Jest y validar cobertura crítica
        run: npm --prefix backend-source/backend run test:ci

      - name: Configurar Node.js para pruebas del frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-source/frontend/package-lock.json

      - name: Correr Vitest y validar cobertura crítica
        run: npm --prefix frontend-source/frontend run test:ci

      # Cada repositorio mantiene su análisis diferencial para evitar depender de la configuración de la otra rama.
      - name: Análisis estático diferencial y quality gate (ESLint)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$GITHUB_BASE_REF"
          else
            case "$GITHUB_REF_NAME" in
              featureE13) base_ref="dev" ;;
              dev) base_ref="main" ;;
              release) base_ref="dev" ;;
              main) base_ref="release" ;;
              *) base_ref="main" ;;
            esac
          fi

          echo "Rama base del análisis: $base_ref"
          git -C backend-source fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          node --check backend-source/backend/.eslintrc.cjs

          mapfile -t backend_files < <(
            git -C backend-source diff --name-only --diff-filter=ACMRT "origin/$base_ref...HEAD" -- backend |
              grep -E '^backend/(config|controllers|middlewares|models|routes|scripts|tests)/.*\.(cjs|js|jsx|mjs)$|^backend/server\.(cjs|js|mjs)$' || true
          )

          eslint_bin="frontend-source/frontend/node_modules/.bin/eslint"
          if (("${#backend_files[@]}")); then
            eslint_files=()
            for file in "${backend_files[@]}"; do
              eslint_files+=("backend-source/$file")
            done
            "$eslint_bin" --config backend-source/backend/.eslintrc.cjs --max-warnings 0 "${eslint_files[@]}"
          else
            echo "Sin archivos fuente modificados en el backend."
          fi

      # En el plan actual de SonarCloud, el quality gate remoto está disponible para main.
      - name: Validar secreto de SonarCloud (main o PR a main)
        if: github.ref_name == 'main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Falta SONAR_TOKEN en Settings > Secrets and variables > Actions de este repositorio."
            exit 1
          fi
      - name: Analizar backend en SonarCloud y esperar el quality gate
        id: sonar
        if: github.ref_name == 'main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: backend-source/backend
          args: >-
            -Dsonar.projectKey=altair222000_Task_Management
            -Dsonar.organization=altair222000
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**,node_modules/**,coverage/**,reports/**
            -Dsonar.coverage.exclusions=scripts/**
            -Dsonar.javascript.lcov.reportPaths=coverage/unit/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Consultar hallazgos nuevos de SonarCloud
        if: failure() && steps.sonar.outcome == 'failure'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: altair222000_Task_Management
        run: |
          set -euo pipefail
          informe="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&branch=main&sinceLeakPeriod=true&issueStatuses=OPEN%2CCONFIRMED&ps=500")"
          printf '%s\n' "$informe" | jq -r '"Incidencias abiertas en código nuevo: \(.total)"'
          printf '%s\n' "$informe" | jq -r '.issues[] | [.type, .severity, .rule, (.component | sub("^.*:"; "")), (.line // 0 | tostring), .message] | @tsv'

      - name: Configurar Node.js para pruebas de API
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.1"
          cache: npm
          cache-dependency-path: backend-source/backend/package-lock.json

      - name: Instalar Newman sin ejecutar scripts de instalación
        run: npm install --global --ignore-scripts newman@6.2.3

      - name: Iniciar API para Newman
        run: |
          mkdir -p backend-source/backend/reports
          cd backend-source/backend
          npm start > "$RUNNER_TEMP/task-management-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/task-management-api.pid"

      - name: Esperar a que la API esté saludable
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > "$RUNNER_TEMP/task-management-health.json"; then
              cat "$RUNNER_TEMP/task-management-health.json"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/task-management-api.log"
          exit 1

      - name: Ejecutar colección API con Newman
        run: |
          cd backend-source/backend
          newman run tests/api/task-management.postman_collection.json \
            --env-var "baseUrl=http://127.0.0.1:3000" \
            --env-var "expectedDatabase=$MONGODB_DB_NAME" \
            --reporters cli,json \
            --reporter-json-export reports/api-tests.json

      - name: Publicar reportes de E10 y E11
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e13-evidence-${{ github.run_number }}
          path: |
            backend-source/backend/coverage/
            backend-source/backend/reports/
            frontend-source/frontend/coverage/
            frontend-source/frontend/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Mostrar log de API si falla el workflow
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/task-management-api.log" ]]; then
            cat "$RUNNER_TEMP/task-management-api.log"
          else
            echo "La API no había iniciado cuando falló el paso anterior."
          fi

  deploy:
    name: E13 · Despliegue backend a Railway
    needs: pipeline
    if: github.event_name == 'push' && contains(fromJSON('["dev","release","main"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'release' && 'qa' || 'production' }}
    steps:
      - name: Descargar la versión promovida
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Configurar Node.js para Railway CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar CLI de Railway con verificación de integridad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/railway"
          archivo="$RUNNER_TEMP/railway/railway.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/railwayapp/cli/releases/download/v5.63.1/railway-v5.63.1-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archivo"
          # Se verifica el digest publicado para la versión fijada antes de ejecutar el binario.
          echo "f5f25b6f0d825bd44e4f96a9f8a0476a3a226cb3facf96eb1bc051f514e1f8b6  $archivo" | sha256sum --check
          tar --extract --gzip --file "$archivo" --directory "$RUNNER_TEMP/railway"
          chmod +x "$RUNNER_TEMP/railway/railway"
          "$RUNNER_TEMP/railway/railway" --version
          echo "$RUNNER_TEMP/railway" >> "$GITHUB_PATH"

      - name: Validar configuración de Railway
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
        run: |
          set -euo pipefail
          for variable in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID RAILWAY_HEALTH_URL; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing ${variable} in this repository's GitHub Environment."
              exit 1
            fi
          done

      - name: Desplegar backend a Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: railway up ./source/backend --path-as-root --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID"

      - name: Verificar API en Railway
        env:
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 "${RAILWAY_HEALTH_URL%/}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The backend health check did not return HTTP 200."
          exit 1
