name: E13 CI/CD backend

on:
  push:
    branches: [dev, release, main]
  pull_request:
    branches: [dev, release, main]

permissions:
  contents: read

jobs:
  pipeline:
    name: E13 backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: "3000"
      MONGODB_URI: mongodb://127.0.0.1:27017/task_management_e13
      MONGODB_DB_NAME: task_management_e13
      JWT_SECRET: e13-ci-only-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.1"

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Validar sintaxis de la API
        run: |
          find backend \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit --prefix backend

      # Sonar verifica el quality gate en cada pull request y en main.
      - name: Analizar código y verificar quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.projectKey=altair222000_Task_Management
            -Dsonar.organization=altair222000
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**,node_modules/**,coverage/**,reports/**
            -Dsonar.javascript.lcov.reportPaths=coverage/unit/lcov.info
            -Dsonar.coverage.exclusions=scripts/**
            -Dsonar.qualitygate.wait=false
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Ejecutar pruebas de API
        run: |
          npm start --prefix backend > "$RUNNER_TEMP/task-management-api.log" 2>&1 &
          for intento in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
            cat "$RUNNER_TEMP/task-management-api.log"
            exit 1
          fi
          npx --yes newman@6.2.3 run backend/tests/api/task-management.postman_collection.json \
            --env-var "baseUrl=http://127.0.0.1:3000" \
            --env-var "expectedDatabase=$MONGODB_DB_NAME"
