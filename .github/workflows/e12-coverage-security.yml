name: E12 - Seguridad y cobertura backend

on:
  push:
    branches: [feature/e12-coverage-security-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
      - name: Instalar dependencias
        run: npm ci --prefix backend
      - name: Ejecutar pruebas y medir cobertura
        run: npm run test:unit --prefix backend
      - name: Confirmar reporte de cobertura
        run: test -s backend/coverage/unit/lcov.info
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e12-backend-coverage
          path: backend/coverage/unit/
          if-no-files-found: warn
